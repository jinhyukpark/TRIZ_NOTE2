  Ionic pages and navigation.

<ion-header>

	<ion-toolbar color="primary">
		<!-- 이상하게 navPop 이 안먹는다 -->
		<ion-buttons left>
			<!--<button ion-button clear large (click)="goBack()">-->
			<button ion-button clear large navPop>
                <ion-icon name = "arrow-back"></ion-icon>
            </button>
		</ion-buttons>

		<ion-title>시스템 진화</ion-title>
	</ion-toolbar>

</ion-header>


<ion-content>

	<ion-list class = "accordinon-list first-list">
        <!-- 1 레벨 -->
        <ion-list-header *ngFor="let item of techEvlouList; let i = index" no-padding>
            <button ion-item (click)="toggleSection(i)" no-lines  detail-none [ngClass]="{'section-active':item.open, 'section': !item.open}">              
                <span class="title-ko">{{item.ko_title }}</span>
                <ion-icon item-right name = "arrow-forward" *ngIf = "!item.open"></ion-icon>
				<ion-icon item-right name = "arrow-down" *ngIf = "item.open"></ion-icon>
            </button>

            <ion-list *ngIf = "item.content && item.open" no-lines class="second-list">
                <!-- 2 레벨 -->
                <ion-list-header *ngFor = "let child of item.content; let j = index" no-padding>
                    <!-- 만약 하위 아이템이 있다면 : 토글 버튼  -->
                    <button ion-item (click)="goSubPage(i, j)" detail-none class = "child-item" *ngIf="child.content" >
						{{ child.ko_title }}
                        <ion-icon item-right name = "arrow-forward" *ngIf = "!child.open"></ion-icon>
						<ion-icon item-right name = "arrow-down" *ngIf = "child.open"></ion-icon>
					</button>

                </ion-list-header>
            </ion-list>
        </ion-list-header>
    </ion-list>

</ion-content>
