  Ionic pages and navigation.

<ion-header>
    <ion-toolbar color="primary">
        <!-- 이상하게 navPop 이 안먹는다 -->
        <ion-buttons left>
            <!--<button ion-button clear large (click)="goBack()">-->
            <button ion-button clear large navPop>
                <ion-icon name = "arrow-back"></ion-icon>
            </button>
        </ion-buttons>

        <ion-title>
            <h1>{{ phyObj.shortKo }}</h1>
            <p class="subscription">{{ phyObj.shortEng }}</p>            
        </ion-title>
    </ion-toolbar>

</ion-header>


<ion-content >
   <ion-list no-lines>
        <ion-list-header class="section-title">요약</ion-list-header>
        <ion-item>
            <ion-grid *ngFor = "let arrItem of phyObj.content; let i = index ">
                <ion-row>
                    <ion-col col-auto>
                        <span class="numbering">{{i+1}}</span>
                    </ion-col>
                   
                    <ion-col text-wrap>
                        <p class="summary-title">{{ arrItem.title }}</p>
                        <!--
                        <p *ngFor="let arritem2 of arrItem.subTitle" class="summary-text">
                            {{arritem2}}
                        </p>
                        -->
                    </ion-col>
                    
                </ion-row>
            </ion-grid>
        </ion-item>
        
        <ion-list-header no-lines class="section-title">생활 속 사례</ion-list-header>
        <ion-card>
            <div class="thumbnail">
                <img src= '{{ "assets/img/phy/"+phyObj.expImg}}' />
            </div>
            <ion-card-content>
                <ion-card-title>
                    {{ phyObj.expTitle }}
                </ion-card-title>
                <p class="ion-card-text">
                    {{ phyObj.expExp }}
                </p>
            </ion-card-content>
        </ion-card>
    </ion-list>

</ion-content>
