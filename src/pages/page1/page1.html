<ion-header>
    <ion-toolbar color="primary">

        <ion-buttons left>
            <button ion-button clear large navPop>
                <ion-icon name = "arrow-back"></ion-icon>
            </button>
        </ion-buttons>

        <ion-title>기술적 모순</ion-title>
    </ion-toolbar>

</ion-header>

<ion-content padding>

    <ion-list>

        <ion-item>
            <ion-label>개선인자</ion-label>
            <ion-select [(ngModel)]="impoveFactor" (ionChange)="onSelectChange($event)" submitText="선택" cancelText="취소">
                <ion-option *ngFor="let item of techDatalist" value={{item.index}}>{{ item.index+'.'+item.strKo }}</ion-option>
            </ion-select>
        </ion-item>


        <ion-item>
            <ion-label>악화인자</ion-label>
            <ion-select [(ngModel)]="deterioFactor" (ionChange)="onSelectChange($event)" submitText="선택" cancelText="취소">
                <ion-option *ngFor="let item of techDatalist" value={{item.index}}>{{ item.index+'.'+item.strKo }}</ion-option>
            </ion-select>
        </ion-item>
    </ion-list>

    <div padding>
        <button ion-button color="primary" block (click)="execute()">모순 적용</button>
    </div>

    <ion-row>

            <ion-col *ngIf= "retArrData[0] != '-' && retArrData[0] != '*' ">
                <!--<button ion-button round small  *ngFor="let item of retArrData" color="secondary" (click)="go40Page()">{{ techDatalist[item].strKo }}</button>-->
                <button ion-button outline small  *ngFor="let item of retArrData" color="secondary" (click)="go40Page(prp40ArrResult[item-1].index-1)">{{ prp40ArrResult[item-1].index+"."+prp40ArrResult[item-1].shortKo }}</button>
            </ion-col>

            <ion-col *ngIf= "retArrData[0] == '-'">
                <button ion-button outline small  *ngFor="let item of retArrData" color="danger">40가지 발명원리를 모두 활용하여 아이디어를 도출하세요</button>
            </ion-col>

            <ion-col *ngIf= "retArrData[0] == '*'">
                <button ion-button outline small  *ngFor="let item of retArrData" color="danger">물리적 모순입니다 분리의 원리로 아이디어를 도출하세요</button>
            </ion-col>
        </ion-row>
</ion-content>
